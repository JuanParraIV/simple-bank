definitions:
  api.createAccountRequest:
    properties:
      currency:
        enum:
        - USD
        - EUR
        type: string
      owner:
        type: string
    required:
    - currency
    - owner
    type: object
  db.Account:
    properties:
      balance:
        type: integer
      created_at:
        type: string
      currency:
        type: string
      id:
        type: integer
      owner:
        type: string
    type: object
info:
  contact: {}
